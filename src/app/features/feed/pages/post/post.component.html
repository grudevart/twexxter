<mat-card>

  <!-- ✅ USER HEADER -->
  <mat-card-header>
    <img 
      mat-card-avatar
      [src]="post.user.avatarUrl"
      alt="avatar"
    />

    <mat-card-title>
      {{ post.user.name }}
    </mat-card-title>

    <mat-card-subtitle>
      {{ post.title }}
    </mat-card-subtitle>
  </mat-card-header>

  <!-- ✅ POST CONTENT -->
  <mat-card-content>
    <p>{{ post.content }}</p>

    @if (post.imageUrl) {
      <img 
        [src]="post.imageUrl"
        class="post-image"
      />
    }
  </mat-card-content>

  <!-- ✅ ACTIONS -->
  <mat-card-actions>
    <!-- <button mat-button (click)="likePost()"> {{ post.likes }} </button> -->
        <button mat-button> {{ post.likes }} </button>
  </mat-card-actions>

</mat-card>
