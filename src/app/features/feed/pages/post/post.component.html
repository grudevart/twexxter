<mat-card>

  <!-- ✅ USER HEADER -->
  <mat-card-header class="mat-card-header">
    <img 
      mat-card-avatar
      [src]="post.user.avatarUrl"
      alt="avatar"
    />

    <mat-card-title>
      {{ post.user.name }}
    </mat-card-title>

  </mat-card-header>

  <!-- ✅ POST CONTENT -->
  <mat-card-content>
        <mat-card-subtitle>
      {{ post.title }}
    </mat-card-subtitle>
    <p>{{ post.content }}</p>

    @if (post.imageUrl) {
      <img 
      class="post-image"
        [src]="post.imageUrl"
      />
    }
  </mat-card-content>

  <!-- ✅ ACTIONS -->
  <mat-card-actions>
        <button mat-button class="post-like-button" (click)="likePost()"><mat-icon>favorite</mat-icon> {{ post.likes }} </button>
  </mat-card-actions>

</mat-card>
